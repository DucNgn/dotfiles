# Tokyo Night Night
set -g pane-border-style "fg=#565f89"
set -g pane-active-border-style "fg=#7aa2f7"
set -g status-style "bg=#16161e,fg=#a9b1d6"
set -g status-left "#[fg=#c0caf5] #S #[fg=#565f89]│ "
set -g status-right "#[fg=#a9b1d6]#(basename #{pane_current_path}) #[fg=#565f89]#(cd #{pane_current_path} && git branch --show-current 2>/dev/null) #[fg=#565f89]│ #[fg=#7aa2f7]%H:%M "
set -g window-status-format "#[fg=#565f89] #I #W "
set -g window-status-current-format "#[fg=#c0caf5,bold] #I #W "
set -g window-status-separator "#[fg=#565f89]·"
set -g message-style "bg=#16161e,fg=#c0caf5"
set -g message-command-style "bg=#16161e,fg=#7aa2f7"
