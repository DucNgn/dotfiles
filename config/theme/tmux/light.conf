# Tokyo Night Day
set -g pane-border-style "fg=#8990b3"
set -g pane-active-border-style "fg=#2e7de9"
set -g status-style "bg=#d0d5e3,fg=#3760bf"
set -g status-left "#[fg=#3760bf] #S #[fg=#8990b3]│ "
set -g status-right "#[fg=#3760bf]#(basename #{pane_current_path}) #[fg=#8990b3]#(cd #{pane_current_path} && git branch --show-current 2>/dev/null) #[fg=#8990b3]│ #[fg=#2e7de9]%H:%M "
set -g window-status-format "#[fg=#8990b3] #I #W "
set -g window-status-current-format "#[fg=#3760bf,bold] #I #W "
set -g window-status-separator "#[fg=#8990b3]·"
set -g message-style "bg=#d0d5e3,fg=#3760bf"
set -g message-command-style "bg=#d0d5e3,fg=#2e7de9"
