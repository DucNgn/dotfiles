[ui.toast]
delivery = "system"

[theme]
name = "tokyo-night-day"
auto_switch = false

[ui]
show_agent_labels_on_pane_borders = true
agent_panel_sort = "spaces"

[keys]
# Use Vim-style movement in the workspace picker.
navigate_workspace_up = "k"
navigate_workspace_down = "j"

# Match the existing tmux split bindings while retaining Herdr's defaults.
rename_tab = ["prefix+comma", "prefix+shift+t"]
split_vertical = ["prefix+d", "prefix+v"]
split_horizontal = ["prefix+b", "prefix+minus"]
toggle_sidebar = "prefix+shift+b"

# Preserve LazyVim's Ctrl+h/j/k/l while providing Vim-style Herdr navigation.
focus_pane_left = ["prefix+h", "ctrl+alt+h"]
focus_pane_down = ["prefix+j", "ctrl+alt+j"]
focus_pane_up = ["prefix+k", "ctrl+alt+k"]
focus_pane_right = ["prefix+l", "ctrl+alt+l"]

# Navigate agents directly with Alt+j/k; keep the prefixed forms as fallbacks.
previous_agent = ["alt+k", "prefix+alt+k"]
next_agent = ["alt+j", "prefix+alt+j"]
focus_agent = ["alt+1..9", "prefix+alt+1..9"]
